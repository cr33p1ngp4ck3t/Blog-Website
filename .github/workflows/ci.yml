name: CI

permissions:
    contents: read

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 24
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Run lint
              run: npm run lint
            - name: Run tests
              run: npm test -- --runInBand

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 24
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Run build
              run: npm run build
